# Overrides & machine-specific rules.
# Window rules: https://wiki.hyprland.org/Configuring/Window-Rules/

# Uncomment for global window transparency:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# --- Steam / Proton (all games: class is steam_app_<appid>) ---
# WoW: fullscreen regardless of AppID (was previously tied to steam_app_0 only)
windowrule = fullscreen on, match:class ^steam_app_[0-9]+$, match:title ^(World of Warcraft)$
# Borderless feel + no open/close anim on game surfaces
windowrule = no_anim on, border_size 0, match:class ^steam_app_[0-9]+$
# Steam/Proton often spawns invisible helper windows with empty title — keep them unfocusable
windowrule = no_focus on, opacity 0, match:class ^steam_app_[0-9]+$, match:title ^$

# --- Android emulator / generic "Emulator" window ---
windowrule = opacity 0, no_focus on, match:title ^(Emulator)$
windowrule = float on, center on, match:class ^(Emulator)$

windowrule = opacity 0.98 0.98, match:class ^(code-oss)$
windowrule = opacity 0.98 0.98, match:class ^([Cc]ode)$
windowrule = opacity 0.98 0.98, match:class ^([Cc]ursor)$
windowrule = opacity 0.95 0.95, match:class ^(code-url-handler)$
windowrule = opacity 0.95 0.95, match:class ^(code-insiders-url-handler)$
windowrule = opacity 0.95 0.95, match:class ^(kitty)$
windowrule = opacity 0.95 0.95, float on, match:class ^(nwg-look)$
windowrule = opacity 0.95 0.95, float on, match:class ^(qt5ct)$
windowrule = opacity 0.95 0.95, float on, match:class ^(qt6ct)$
windowrule = opacity 0.95 0.95, float on, match:class ^(kvantummanager)$
windowrule = opacity 0.95 0.95, float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = opacity 0.95 0.95, float on, match:class ^(blueman-manager)$
windowrule = opacity 0.95 0.95, float on, match:class ^(nm-applet)$
windowrule = opacity 0.95 0.95, float on, match:class ^(nm-connection-editor)$
windowrule = opacity 0.95 0.95, float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = opacity 0.95 0.95, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 0.95 0.95, match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = opacity 0.95 0.95, match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$
windowrule = opacity 0.95 0.95, match:class ^([Ss]team)$
windowrule = opacity 0.95 0.95, match:class ^(steamwebhelper)$
windowrule = opacity 0.95 0.95, match:class ^([Ss]potify)$
windowrule = opacity 0.95 0.95, match:class ^((.*)Nautilus(.*))$
windowrule = opacity 0.95 0.95, match:initial_title ^(Spotify(.*))$
windowrule = opacity 0.95 0.95, match:title ^((.*)WhatsApp)$
windowrule = opacity 0.95 0.95, match:title ^((.*)Thunderbird)$