# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Games
windowrule = fullscreen on, match:class ^(steam_app_0)$, match:title ^(World of Warcraft)$
windowrule = no_anim noborder, match:class ^(steam_app_0)$
windowrule = no_focus on, opacity 0, match:class ^(steam_app_0)$, match:title ^$

# Other
windowrule = opacity 0, no_focus on, match:title ^(Emulator)$
windowrule = float on, center on, match:class ^(Emulator)$