# Session startup

# Bar, wallpaper
exec-once = qs -c $qsConfig &
exec-once = ~/.config/hypr/custom/scripts/__restore_video_wallpaper.sh

# Core components (authentication, lock screen, Polkit GUI — polkit-gnome)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk

# Tray
exec-once = udiskie --no-automount --smart-tray --menu-update-workaround

# Clipboard: clear persisted history each session (still supports text + image via wl-paste watchers below)
exec-once = cliphist wipe

# Clipboard: history
# exec-once = wl-paste --watch cliphist store &
exec-once = wl-paste --type text --watch bash -c 'cliphist store && qs -c $qsConfig ipc call cliphistService update'
exec-once = wl-paste --type image --watch bash -c 'cliphist store && qs -c $qsConfig ipc call cliphistService update'

# Keyboard: US International (dead keys) for ç with '+c, etc. Also sync for XWayland apps
exec-once = setxkbmap -layout us -variant intl

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
