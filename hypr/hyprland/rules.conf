# Window rules — order matters: later rules override earlier ones for the same effect.
# Ref: https://wiki.hyprland.org/Configuring/Window-Rules/

# --- File / save dialogs & similar (GTK, Qt, Electron patterns) ---
windowrule = match:title ^(Open File|Select a File|Open Folder|Save As|Library|File Upload)(.*)$, float on, center on
windowrule = match:title ^(Choose wallpaper)(.*)$, float on, center on, size (monitor_w*.60) (monitor_h*.65)
windowrule = match:title ^(.*)(wants to save|wants to open)$, float on, center on

# --- Modal popups (confirm dialogs, etc.) ---
windowrule = match:modal 1, float on, center on

# --- Pinentry (GPG / SSH) — avoid focus stealing while typing passphrase ---
windowrule = stay_focused on, match:class (pinentry-)(.*)

# --- Polkit / policy-kit password prompts ---
windowrule = float on, center on, size (monitor_w*.42) (monitor_h*.38), match:class ^(polkit-gnome-authentication-agent-1|lxpolkit|lxqt-policykit-agent)$

# --- Small utilities & system trays (audio, BT, network) ---
windowrule = match:class ^(blueberry\.py|blueman-manager|guifetch|pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor)$, float on, center on, size (monitor_w*.45) (monitor_h*.45)

windowrule = match:title ^(Donwaztok Settings)$, float on
windowrule = match:title .*Shell conflicts.*, float on

# --- GNOME Settings ---
windowrule = match:class ^(org\.gnome\.Settings|Gnome-control-center)$, float on, center on, size (monitor_w*.55) (monitor_h*.70)

# --- Desktop portals & reference tools ---
windowrule = match:class org.freedesktop.impl.portal.desktop.gtk, float on, size (monitor_w*.60) (monitor_h*.65)
windowrule = match:class ^(Zotero)$, float on, size (monitor_w*.45) (monitor_h*.45)

# --- Terminals & dev tools ---
windowrule = match:class ^dev\.warp\.Warp$, tile on

# --- Picture-in-picture (browser / players) ---
windowrule = match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$, float on, pin on, keep_aspect_ratio on, move (monitor_w*.73) (monitor_h*.72), size (monitor_w*.25) (monitor_h*.25)

# --- Video: inhibit idle / screen lock while fullscreen ---
windowrule = idle_inhibit fullscreen, match:class ^(mpv|vlc|io.github.celluloid_player.Celluloid)$

# --- Wine / Proton helpers ---
windowrule = no_max_size on, match:class ^(.*[Ww]inecfg.*|winecfg)$

# --- Games / tearing (Proton, native) ---
windowrule = match:title .*\.exe, immediate on
windowrule = match:title .*[Mm]inecraft.*, immediate on
windowrule = immediate on, match:class ^steam_app_[0-9]+$

# --- JetBrains IDE helper popups (empty title / winN) ---
windowrule = match:class ^jetbrains-.*$, match:float 1, match:title ^$|^\s$|^win\d+$, no_initial_focus on

# --- Tiled windows: no shadow (cleaner stack) ---
windowrule = match:float 0, no_shadow on

workspace = special:special, gapsout:30

# --- Layers: xray + skip animations on known overlay namespaces ---
layerrule = match:namespace .*, xray on
layerrule = match:namespace ^(walker|selection|overview|anyrun|osk|hyprpicker|noanim|indicator.*)$, no_anim on
layerrule = match:namespace ^quickshell:(actionCenter|cheatsheet|lockWindowPusher|polkit|regionSelector|screenshot|session|reloadPopup)$, no_anim on
layerrule = match:namespace quickshell:popup, xray off
layerrule = match:namespace gtk4-layer-shell, no_anim on
