[package]
name = "fm"
version = "0.1.0"
edition = "2021"
description = "Donwaztok file manager CLI (Rust port of fm.py)"

[[bin]]
name = "fm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
duct = "0.13"
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
libc = "0.2"
mime_guess = "2"
nix = { version = "0.29", features = ["inotify", "fs"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }
