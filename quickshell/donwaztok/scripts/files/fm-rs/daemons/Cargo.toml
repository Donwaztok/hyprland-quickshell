[package]
name = "donwaztok-daemons"
version = "0.1.0"
edition = "2021"
description = "Long-running D-Bus helpers (FileChooser portal, BlueZ agent), kept out of fm"

[[bin]]
name = "donwaztok-portal"
path = "src/portal.rs"

[[bin]]
name = "donwaztok-bt-agent"
path = "src/bt_agent.rs"

[dependencies]
async-channel = "2"
async-io = "2"
percent-encoding = "2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
